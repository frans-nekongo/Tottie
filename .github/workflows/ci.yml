# Tottie CI — Joel #3 (daily builds). Red until W0 lands the first tests; that is honest.
# Docs compile stays local (texlive too heavy for CI); everything else builds here.
name: ci
on: [push]
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m venv core/venv && core/venv/bin/pip install -r core/requirements.txt
      - run: ./core/scripts/init_db.sh
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          TOTTIE_DB_NAME: tottie_test
      - run: ./venv/bin/python -m pytest tests -q
        working-directory: core
        env:
          TOTTIE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/tottie_test
          TOTTIE_API_TOKEN: ci-token
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install && npm run build
        working-directory: ui
