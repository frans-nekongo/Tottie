<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#000000"/><text x="960" y="440" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Simulate the brain's solutions.</text><text x="960" y="540" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="bold" fill="#E8A33D" text-anchor="middle" letter-spacing="0">Never simulate its constraints.</text><rect x="760" y="620" width="400" height="8" fill="#14B8A6"/><text x="960" y="720" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#14B8A6" text-anchor="middle" font-style="italic" letter-spacing="0">We didn't copy the forgetting. We copied the finding.</text></svg>
